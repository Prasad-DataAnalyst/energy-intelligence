name: Daily YouTube Video — GetMindFuelNow

on:
  schedule:
    - cron: '0 15 * * *'   # Every day at 15:00 UTC (11 AM US Eastern)
  workflow_dispatch:        # Also allows manual trigger from GitHub website

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours max

    steps:

    # ── 1. Download the code ─────────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ── 2. Set up Python ─────────────────────────────────────────────────────
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: youtube_automation/requirements.txt

    # ── 3. Install system tools (ffmpeg, espeak) ─────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg espeak-ng libespeak-ng-dev

    # ── 4. Install Python packages ───────────────────────────────────────────
    - name: Install Python dependencies
      run: |
        cd youtube_automation
        pip install -r requirements.txt

    # ── 5. Write YouTube OAuth token from secret ─────────────────────────────
    - name: Restore YouTube token
      run: |
        cd youtube_automation
        echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > youtube_token.json
        echo "Token restored"

    # ── 6. Write Google OAuth client secrets ─────────────────────────────────
    - name: Restore client secrets
      run: |
        cd youtube_automation
        echo "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" | base64 -d > client_secrets.json
        echo "Client secrets restored"

    # ── 7. Write .env file with all API keys ─────────────────────────────────
    - name: Create .env file
      run: |
        cd youtube_automation
        cat > .env << 'EOF'
        YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}
        ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
        PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
        UPLOAD_TIME=15:00
        VIDEO_WIDTH=1920
        VIDEO_HEIGHT=1080
        VIDEO_FPS=24
        YOUTUBE_CATEGORY_ID=27
        YOUTUBE_PRIVACY_STATUS=public
        EOF

    # ── 8. Run the full pipeline ──────────────────────────────────────────────
    - name: Run cinematic pipeline
      run: |
        cd youtube_automation
        python core/cinematic_daily_pipeline.py --now
      env:
        PYTHONUNBUFFERED: "1"

    # ── 9. Save logs even if pipeline fails ───────────────────────────────────
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-logs-${{ github.run_id }}
        path: |
          youtube_automation/logs/
          youtube_automation/output/*/production_log.json
          youtube_automation/output/*/script.txt
          youtube_automation/output/*/seo_package.json
        retention-days: 14
        if-no-files-found: ignore
