# ── Viral Pipeline Configuration ─────────────────────────────────────────────
# Edit this file to customise every aspect of video production.

video:
  platform: youtube            # youtube | tiktok | reels
  duration_mode: auto          # auto | short (≤60s) | standard (8-12min)
  resolution: "1280x720"       # 1920x1080 for full HD (slower render)
  fps: 15                      # 15 is plenty for talking-head style
  style_preset: tech-dark      # tech-dark | vlog-warm | news-clean | motivation-epic
  crf: 20                      # H.264 quality (lower = better, 18-28 range)

audio:
  voice_provider: elevenlabs   # elevenlabs | edge_tts | espeak
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM"   # Rachel – clear US female
  espeak_voice: "en-us+f3"
  espeak_speed: 168
  espeak_pitch: 58
  voice_db: -6                 # voice track level (dBFS)
  music_db: -18                # background music level
  sample_rate: 44100

visuals:
  image_provider: replicate    # replicate | stability | mock
  replicate_model: "stability-ai/sdxl:39ed52f2a78e934b3ba6e2a89f5b1c712de7dfea535525255b1aa35c5565e08b"
  broll_provider: pexels       # pexels | pixabay | none
  style: cinematic             # cinematic | vibrant | minimal | dark_neon
  negative_prompt: "blurry, watermark, text, low quality, cartoon, anime"

script:
  model: claude-sonnet-4-6     # Anthropic model for script & metadata generation
  max_tokens: 4096
  hook_duration: 3             # seconds for hook scene
  pattern_interrupt: true
  value_loop: true
  scenes_per_minute: 4         # pacing: how many scene cuts per minute

thumbnails:
  count: 3
  font_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
  styles:
    - name: contrast
      bg: [10, 10, 40]
      accent: [255, 215, 0]
    - name: warm
      bg: [40, 15, 5]
      accent: [255, 107, 53]
    - name: epic
      bg: [5, 20, 35]
      accent: [0, 212, 255]

trends:
  sources: [youtube, reddit, google]
  min_score: 0.3               # discard trends scoring below this
  max_candidates: 10
  velocity_weight: 0.4
  engagement_weight: 0.4
  content_fit_weight: 0.2

output:
  base_dir: output
  keep_temp: false
  save_storyboard_pdf: false   # requires reportlab

style_presets:
  tech-dark:
    bg_primary: [5, 10, 25]
    bg_secondary: [10, 20, 45]
    accent: [0, 212, 255]
    highlight: [80, 230, 255]
    image_keywords: "dark technology, neon, futuristic, cinematic"
  vlog-warm:
    bg_primary: [35, 20, 10]
    bg_secondary: [55, 35, 15]
    accent: [255, 170, 50]
    highlight: [255, 200, 100]
    image_keywords: "warm lifestyle, golden hour, authentic, candid"
  news-clean:
    bg_primary: [15, 15, 20]
    bg_secondary: [25, 25, 35]
    accent: [220, 40, 40]
    highlight: [255, 80, 80]
    image_keywords: "news, professional, clean, editorial, broadcast"
  motivation-epic:
    bg_primary: [10, 5, 20]
    bg_secondary: [20, 10, 40]
    accent: [180, 80, 255]
    highlight: [220, 130, 255]
    image_keywords: "epic, inspirational, dramatic lighting, motivation, power"
